                <div style="margin-top:4px;white-space:nowrap;font-size:21px;font-weight:800;letter-spacing:-.5px;color:${p.text};">${value}<span style="font-size:12px;font-weight:700;color:${p.muted};margin-left:3px;letter-spacing:0;">hPa</span></div>
              </div>
            </div>`;
            ]]]
