      - type: custom:button-card
        entity: sensor.pepper_ducato_obd_ble_verbrauch_pro_100_km
        show_name: false
        show_icon: false
        show_state: false
        tap_action:
          action: more-info
        triggers_update:
        - sensor.pepper_ducato_obd_ble_geschwindigkeit_obd
        - sensor.pepper_ducato_obd_ble_verbrauch_pro_100_km
        grid_options:
          columns: 6
          rows: auto
        styles:
          card:
          - width: 100%
          - aspect-ratio: 1 / 1
          - padding: 0
          - border-radius: 8%
          - overflow: hidden
          - background: '#1c1c1e'
          - border: 1px solid rgba(255,255,255,0.08)
