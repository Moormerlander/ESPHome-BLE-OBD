# =================================================================
# OBD2-View im Stil des Cockpit-Views
# - Farbschema folgt input_select.cockpit_farbschema (Hell / Dunkel / Automatisch)
# - Benötigt custom:button-card (wie der Cockpit-View)
# - Einfügen: Dashboard bearbeiten -> Raw-Konfigurationseditor -> den
#   bisherigen OBD2-View (ab "- type: sections ... title: OBD2") durch
#   diesen Block ersetzen (Einrückung: 2 Leerzeichen unter "views:")
# - Passend zu ESPHome ducato-obd-ble v1.9
# =================================================================
  - type: sections
    max_columns: 2
    title: OBD2
    path: obd2
    icon: mdi:engine
    sections:
    - type: grid
      column_span: 2
      cards:
      - type: custom:button-card
        show_icon: false
        show_name: false
        show_state: false
        triggers_update:
        - binary_sensor.pepper_ducato_obd_ble_motorsteuergerat_aktiv
        - sensor.pepper_ducato_obd_ble_bordspannung
        - switch.pepper_ducato_obd_ble_vgate_verbindung
        - sun.sun
        - input_select.cockpit_farbschema
        tap_action:
          action: none
        custom_fields:
          c: |-
            [[[
            const mode = states['input_select.cockpit_farbschema']?.state || 'Automatisch';
            const lightMode = mode === 'Hell' || (mode === 'Automatisch' && states['sun.sun']?.state === 'above_horizon');
            const p = lightMode ? {
              accent: '#b96b00', accentAlt: '#874900', text: '#30251a', soft: '#554632', muted: '#79684f',
              track: '#e2d1b7', inactive: '#a89070'
            } : {
              accent: '#ff9f0a', accentAlt: '#a84f00', text: '#f0e4d4', soft: '#d0c2af', muted: '#c9b79e',
              track: '#292117', inactive: '#a89070'
            };
            const num = (id) => { const s = states[id]; const v = s ? parseFloat(s.state) : NaN; return Number.isFinite(v) ? v : NaN; };
            const de = (v, d) => v.toFixed(d).replace('.', ',');
            const ecu = states['binary_sensor.pepper_ducato_obd_ble_motorsteuergerat_aktiv']?.state;
            const v = num('sensor.pepper_ducato_obd_ble_bordspannung');
            let dot = '#777777', txt = 'OFFLINE';
            if (ecu === 'on')  { dot = '#32d74b'; txt = 'MOTORSTEUERGERÄT AKTIV'; }
            if (ecu === 'off') { dot = p.inactive; txt = 'RUHEMODUS'; }
            const bt = states['switch.pepper_ducato_obd_ble_vgate_verbindung']?.state;
            const btcol = bt === 'on' ? '#32d74b' : bt === 'off' ? p.inactive : '#777777';
            const bttxt = bt === 'on' ? 'VGATE VERBUNDEN' : bt === 'off' ? 'VGATE GETRENNT' : 'VGATE --';
            const vcol = !Number.isFinite(v) ? p.muted : v < 12 ? '#ff5d69' : v >= 13.2 ? '#32d74b' : p.text;
            const pill = (inner, col) => `<div style="display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:${col}1f;border:1px solid ${col}55;font-size:10px;font-weight:800;letter-spacing:1.2px;color:${col};white-space:nowrap;">${inner}</div>`;
            return `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:100%;padding:0 4px;box-sizing:border-box;">
              <div style="display:flex;align-items:center;gap:12px;min-width:0;">
                <ha-icon icon="mdi:engine" style="--mdc-icon-size:28px;color:${p.accent};flex:none;"></ha-icon>
                <div style="min-width:0;line-height:1.05;">
                  <div style="font-size:20px;font-weight:800;letter-spacing:-.3px;color:${p.text};white-space:nowrap;">Ducato OBD</div>
                  <div style="font-size:10px;font-weight:800;letter-spacing:1.5px;color:${p.muted};margin-top:3px;white-space:nowrap;">VGATE ICAR PRO</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
                ${pill(`<ha-icon icon="${bt === 'on' ? 'mdi:bluetooth-connect' : 'mdi:bluetooth-off'}" style="--mdc-icon-size:14px;"></ha-icon>${bttxt}`, btcol)}
                ${pill(`<span style="width:8px;height:8px;border-radius:50%;background:${dot};box-shadow:0 0 8px ${dot};"></span>${txt}`, dot)}
                ${pill(`<ha-icon icon="mdi:car-battery" style="--mdc-icon-size:14px;"></ha-icon>${Number.isFinite(v) ? de(v, 1) + ' V' : '-- V'}`, vcol)}
              </div>
            </div>`;
            ]]]
        styles:
          card:
          - height: 76px
          - border-radius: 22px
          - padding: 8px 14px
          - box-sizing: border-box
          - background: |-
              [[[
              const mode = states['input_select.cockpit_farbschema']?.state || 'Automatisch';
              const lightMode = mode === 'Hell' || (mode === 'Automatisch' && states['sun.sun']?.state === 'above_horizon');
              return lightMode ? 'linear-gradient(145deg, #fffaf2 0%, #f0e2cf 100%)' : 'linear-gradient(145deg, #221c16 0%, #12100d 100%)';
              ]]]
          - border: |-
              [[[
              const mode = states['input_select.cockpit_farbschema']?.state || 'Automatisch';
              const lightMode = mode === 'Hell' || (mode === 'Automatisch' && states['sun.sun']?.state === 'above_horizon');
              return lightMode ? '1px solid rgba(185,107,0,.30)' : '1px solid rgba(255,159,10,.22)';
              ]]]
          - box-shadow: |-
              [[[
              const mode = states['input_select.cockpit_farbschema']?.state || 'Automatisch';
              const lightMode = mode === 'Hell' || (mode === 'Automatisch' && states['sun.sun']?.state === 'above_horizon');
              return lightMode ? '0 4px 16px rgba(80,45,0,.10)' : '0 4px 16px rgba(0,0,0,.24)';
              ]]]
          - color: |-
              [[[
              const mode = states['input_select.cockpit_farbschema']?.state || 'Automatisch';
              const lightMode = mode === 'Hell' || (mode === 'Automatisch' && states['sun.sun']?.state === 'above_horizon');
              return lightMode ? '#30251a' : '#f0e4d4';
              ]]]
          grid:
          - grid-template-areas: '"c"'
          - grid-template-columns: minmax(0, 1fr)
          - grid-template-rows: 1fr
          custom_fields:
            c:
            - width: 100%
            - height: 100%
        grid_options:
          columns: 24
          rows: auto
      - type: custom:button-card
        entity: sensor.pepper_ducato_obd_ble_adblue_fullstand
        show_name: false
        show_icon: false
        show_state: false
        tap_action:
          action: more-info
        triggers_update:
        - sensor.pepper_ducato_obd_ble_adblue_fullstand
        grid_options:
          columns: 6
          rows: auto
        styles:
          card:
          - width: 100%
          - aspect-ratio: 1 / 1
          - padding: 0
          - border-radius: 8%
          - overflow: hidden
          - background: '#1c1c1e'
          - border: 1px solid rgba(255,255,255,0.08)
          - box-shadow: none
          grid:
          - grid-template-areas: '"dial"'
          - grid-template-columns: 1fr
          - grid-template-rows: 1fr
          custom_fields:
            dial:
            - width: 100%
            - height: 100%
        custom_fields:
          dial: |-
            [[[
            var C = (function () {
            var v = parseFloat(states['sensor.pepper_ducato_obd_ble_adblue_fullstand']?.state);
            var ok = Number.isFinite(v);
            var l = ok ? (v / 100 * 19) : NaN;
            return { v: v, min: 0, max: 100, step: 25, labels: ['E', '¼', '½', '¾', 'F'],
                     zones: [[0, 15, '#ff5364'], [15, 30, '#ffb52e']],
                     text: ok ? Math.round(v) + '%' : '--', unit: 'ADBLUE',
                     sub: ok ? '≈ ' + l.toFixed(1).replace('.', ',') + ' l' : '',
                     col: !ok ? '#777' : v < 15 ? '#ff5364' : v < 30 ? '#ffb52e' : '#ffffff', icon: 'M12,20A6,6 0 0,1 6,14C6,10 12,3.25 12,3.25C12,3.25 18,10 18,14A6,6 0 0,1 12,20Z' };
            })();
            var valid = Number.isFinite(C.v);
            var val = valid ? Math.max(C.min, Math.min(C.max, C.v)) : C.min;
            var WHT = '#ffffff', ACC = '#ff9f0a', MUT = '#c9b79e';
            var F = 'font-family="Arial, Helvetica, sans-serif"';
            var A0 = -125, A1 = 125;
            var ang = function (x) { return A0 + (A1 - A0) * (x - C.min) / (C.max - C.min); };
            var P = function (deg, r) { var a = deg * Math.PI / 180; return [r * Math.sin(a), -r * Math.cos(a)]; };
            var arc = function (a1, a2, r, col, w) {
              var p1 = P(a1, r), p2 = P(a2, r);
              return '<path d="M ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + ' A ' + r + ' ' + r + ' 0 ' + ((a2 - a1) > 180 ? 1 : 0) + ' 1 ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1) + '" fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="butt"/>';
            };
            var s = [];
            s.push('<svg viewBox="30 30 970 970" preserveAspectRatio="xMidYMid meet" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">');
            s.push('<defs>');
            s.push('<radialGradient id="gFaceadb" gradientUnits="userSpaceOnUse" cx="0" cy="-120" r="640"><stop offset="0" stop-color="#2b2c31"/><stop offset="1" stop-color="#0e0e10"/></radialGradient>');
            s.push('<linearGradient id="gBezeladb" gradientUnits="userSpaceOnUse" x1="-340" y1="-340" x2="340" y2="340"><stop offset="0" stop-color="#6b6d73"/><stop offset="0.45" stop-color="#2a2b2f"/><stop offset="1" stop-color="#0e0e10"/></linearGradient>');
            s.push('<radialGradient id="gGlareadb" gradientUnits="userSpaceOnUse" cx="-120" cy="-260" r="260" gradientTransform="translate(-120 -260) rotate(-24) scale(1.3 0.58) translate(120 260)"><stop offset="0" stop-color="#fff" stop-opacity="0.13"/><stop offset="0.6" stop-color="#fff" stop-opacity="0.04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>');
            s.push('<filter id="gShadowadb" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/></filter>');
            s.push('<clipPath id="gDiscadb"><circle cx="0" cy="0" r="454"/></clipPath>');
            s.push('</defs>');
            s.push('<g transform="translate(512 514)">');
            s.push('<circle cx="0" cy="0" r="468" fill="none" stroke="url(#gBezeladb)" stroke-width="27"/>');
            s.push('<circle cx="0" cy="0" r="481" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="1.5"/>');
            s.push('<circle cx="0" cy="0" r="455" fill="none" stroke="#000" stroke-opacity="0.85" stroke-width="4"/>');
            s.push('<circle cx="0" cy="0" r="454" fill="url(#gFaceadb)"/>');
            /* Farbzonen + Wertbogen */
            s.push(arc(A0, A1, 412, '#ffffff22', 18));
            for (var z = 0; z < (C.zones || []).length; z++) s.push(arc(ang(C.zones[z][0]), ang(C.zones[z][1]), 412, C.zones[z][2], 18));
            if (valid && val > C.min) s.push(arc(A0, ang(val), 412, C.col || ACC, 18));
            /* Skala */
            var n = Math.round((C.max - C.min) / C.step);
            for (var i = 0; i <= n * 2; i++) {
              var x = C.min + i * C.step / 2, major = (i % 2 === 0);
              var a = ang(x), q1 = P(a, 392), q2 = P(a, major ? 340 : 362);
              s.push('<line x1="' + q1[0].toFixed(1) + '" y1="' + q1[1].toFixed(1) + '" x2="' + q2[0].toFixed(1) + '" y2="' + q2[1].toFixed(1) + '" stroke="' + WHT + '" stroke-width="' + (major ? 7 : 4) + '"/>');
              if (major) {
                var lbl = C.labels ? C.labels[i / 2] : String(x);
                var t = P(a, 282);
                s.push('<text x="' + t[0].toFixed(1) + '" y="' + (t[1] + 20).toFixed(1) + '" fill="' + WHT + '" font-size="58" font-weight="700" text-anchor="middle" ' + F + '>' + lbl + '</text>');
              }
            }
            /* Anzeige */
            if (C.icon) s.push('<g transform="translate(-36 -215) scale(3)"><path d="' + C.icon + '" fill="' + MUT + '" fill-opacity="0.75"/></g>');
            s.push('<text x="0" y="205" fill="' + (valid ? (C.col || WHT) : '#777') + '" font-size="124" font-weight="800" text-anchor="middle" letter-spacing="-4" ' + F + '>' + (valid ? C.text : '--') + '</text>');
            s.push('<text x="0" y="268" fill="' + MUT + '" font-size="40" font-weight="800" letter-spacing="5" text-anchor="middle" ' + F + '>' + C.unit + '</text>');
            if (C.sub) s.push('<text x="0" y="345" fill="' + WHT + '" fill-opacity="0.85" font-size="46" font-weight="700" text-anchor="middle" ' + F + '>' + C.sub + '</text>');
            /* Zeiger */
            s.push('<g filter="url(#gShadowadb)" transform="rotate(' + ang(val).toFixed(2) + ')">');
            s.push('<polygon points="-11,40 11,40 4,-380 -4,-380" fill="' + (valid ? ACC : '#777') + '"/>');
            s.push('</g>');
            s.push('<circle cx="0" cy="0" r="36" fill="#1b1b1e" stroke="#555" stroke-width="4"/>');
            s.push('<circle cx="0" cy="0" r="12" fill="' + (valid ? ACC : '#777') + '"/>');
            /* Glas */
            s.push('<g clip-path="url(#gDiscadb)"><ellipse cx="-120" cy="-260" rx="340" ry="150" transform="rotate(-24 -120 -260)" fill="url(#gGlareadb)"/></g>');
            s.push('</g></svg>');
            return s.join('');
            ]]]
