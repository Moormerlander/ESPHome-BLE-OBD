# Ducato OBD – Übersicht für den OBD-View (passend zu ESPHome v1.8)
# Einfügen: Dashboard bearbeiten → Karte → Manuell → diesen Code einfügen.
# Benötigt custom:button-card. Entity-IDs ggf. unter "variables" anpassen
# (und in triggers_update).

type: vertical-stack
cards:
  # ---------------------------------------------------------------
  # Übersicht mit allen Sensoren
  # ---------------------------------------------------------------
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    triggers_update:
      - sensor.pepper_ducato_obd_ble_adblue_fullstand
      - sensor.pepper_ducato_obd_ble_adblue_temperatur
      - sensor.pepper_ducato_obd_ble_adblue_konzentration
      - sensor.pepper_ducato_obd_ble_dieseltank
      - sensor.pepper_ducato_obd_ble_kraftstoffverbrauch
      - sensor.pepper_ducato_obd_ble_verbrauch_pro_100_km
      - sensor.pepper_ducato_obd_ble_drehzahl
      - sensor.pepper_ducato_obd_ble_geschwindigkeit_obd
      - sensor.pepper_ducato_obd_ble_kuhlmitteltemperatur
      - sensor.pepper_ducato_obd_ble_bordspannung
      - sensor.pepper_ducato_obd_ble_obd_letzte_antwort
      - sensor.pepper_ducato_obd_ble_aussentemperatur
      - sensor.pepper_ducato_obd_ble_oltemperatur
      - sensor.pepper_ducato_obd_ble_luftdruck
      - sensor.pepper_ducato_obd_ble_dpf_beladung
      - sensor.pepper_ducato_obd_ble_dpf_differenzdruck
      - binary_sensor.pepper_ducato_obd_ble_dpf_regeneration
      - binary_sensor.pepper_ducato_obd_ble_motorsteuergerat_aktiv
    variables:
      e_adblue: sensor.pepper_ducato_obd_ble_adblue_fullstand
      e_def_temp: sensor.pepper_ducato_obd_ble_adblue_temperatur
      e_def_conc: sensor.pepper_ducato_obd_ble_adblue_konzentration
      e_diesel: sensor.pepper_ducato_obd_ble_dieseltank
      e_lph: sensor.pepper_ducato_obd_ble_kraftstoffverbrauch
      e_l100: sensor.pepper_ducato_obd_ble_verbrauch_pro_100_km
      e_rpm: sensor.pepper_ducato_obd_ble_drehzahl
      e_speed: sensor.pepper_ducato_obd_ble_geschwindigkeit_obd
      e_temp: sensor.pepper_ducato_obd_ble_kuhlmitteltemperatur
      e_volt: sensor.pepper_ducato_obd_ble_bordspannung
      e_last: sensor.pepper_ducato_obd_ble_obd_letzte_antwort
      e_ecu: binary_sensor.pepper_ducato_obd_ble_motorsteuergerat_aktiv
      e_ambient: sensor.pepper_ducato_obd_ble_aussentemperatur
      e_oil: sensor.pepper_ducato_obd_ble_oltemperatur
      e_baro: sensor.pepper_ducato_obd_ble_luftdruck
      e_dpf_load: sensor.pepper_ducato_obd_ble_dpf_beladung
      e_dpf_dp: sensor.pepper_ducato_obd_ble_dpf_differenzdruck
      e_dpf_regen: binary_sensor.pepper_ducato_obd_ble_dpf_regeneration
      adblue_l: 19        # AdBlue-Tank in Litern
      diesel_l: 90        # Dieseltank in Litern (Ducato: 75 l Serie, 90 l optional)
    styles:
      card:
        - padding: 16px
        - border-radius: 16px
      grid:
        - grid-template-areas: >-
            "header header"
            "dpf dpf"
            "adblue diesel"
            "deftemp defconc"
            "rpm speed"
            "l100 lph"
            "temp oil"
            "ambient baro"
            "volt volt"
            "last last"
        - grid-template-columns: 1fr 1fr
        - grid-template-rows: auto
        - row-gap: 10px
        - column-gap: 10px
      custom_fields:
        header:
          - justify-self: stretch
          - width: 100%
          - overflow: visible
        last:
          - justify-self: stretch
          - width: 100%
          - overflow: visible
    extra_styles: |
      .tile {
        background: var(--secondary-background-color);
        border-radius: 12px;
        padding: 10px 12px;
        text-align: left;
      }
      .lbl { font-size: 12px; opacity: 0.7; display: flex; align-items: center; gap: 4px; }
      .lbl ha-icon { --mdc-icon-size: 14px; }
      .val { font-size: 22px; font-weight: 600; line-height: 1.3; }
      .val span { font-size: 13px; font-weight: 400; opacity: 0.7; }
      .bar { height: 10px; border-radius: 5px; background: rgba(127,127,127,0.25);
             margin-top: 8px; overflow: hidden; }
      .fill { height: 100%; border-radius: 5px; transition: width 0.6s; }
      .mono { font-family: monospace; font-size: 12px; white-space: normal;
              word-break: break-all; margin-top: 4px; opacity: 0.85; }
    custom_fields:
      header: |
        [[[
          const st = states[variables.e_ecu];
          let col = '#9e9e9e', txt = 'Offline';
          if (st && st.state === 'on')  { col = '#4caf50'; txt = 'Motorsteuergerät aktiv'; }
          if (st && st.state === 'off') { col = '#9e9e9e'; txt = 'Ruhemodus'; }
          return `<div style="display:flex;align-items:center;justify-content:space-between;width:100%">
                    <div style="display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600">
                      <ha-icon icon="mdi:car-info" style="--mdc-icon-size:22px"></ha-icon>Ducato OBD
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap">
                      <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${col}"></span>${txt}
                    </div>
                  </div>`;
        ]]]
      adblue: |
        [[[
          const s = states[variables.e_adblue];
          const v = s ? parseFloat(s.state) : NaN;
          const ok = !isNaN(v);
          const pct = ok ? Math.max(0, Math.min(100, v)) : 0;
          const col = !ok ? 'grey' : pct < 15 ? '#e53935' : pct < 30 ? '#fb8c00' : '#1e88e5';
          const l = ok ? (pct / 100 * variables.adblue_l).toFixed(1).replace('.', ',') : '';
          return `<div class="tile">
                    <div class="lbl"><ha-icon icon="mdi:water-percent"></ha-icon>AdBlue</div>
                    <div class="val">${ok ? Math.round(pct) : '–'}<span> %</span>
                      ${ok ? `<span style="margin-left:6px">≈ ${l} l</span>` : ''}</div>
                    <div class="bar"><div class="fill" style="width:${pct}%;background:${col}"></div></div>
                  </div>`;
        ]]]
      diesel: |
        [[[
          const s = states[variables.e_diesel];
          const v = s ? parseFloat(s.state) : NaN;
          const ok = !isNaN(v);
          const pct = ok ? Math.max(0, Math.min(100, v)) : 0;
          const col = !ok ? 'grey' : pct < 10 ? '#e53935' : pct < 20 ? '#fb8c00' : '#43a047';
          const l = ok ? Math.round(pct / 100 * variables.diesel_l) : '';
          return `<div class="tile">
                    <div class="lbl"><ha-icon icon="mdi:gas-station"></ha-icon>Diesel</div>
                    <div class="val">${ok ? Math.round(pct) : '–'}<span> %</span>
                      ${ok ? `<span style="margin-left:6px">≈ ${l} l</span>` : ''}</div>
                    <div class="bar"><div class="fill" style="width:${pct}%;background:${col}"></div></div>
                  </div>`;
        ]]]
      deftemp: |
        [[[
          const s = states[variables.e_def_temp];
          const v = s ? parseFloat(s.state) : NaN;
          const col = isNaN(v) ? 'inherit' : v <= -5 ? '#42a5f5' : 'inherit';
          return `<div class="tile"><div class="lbl"><ha-icon icon="mdi:thermometer"></ha-icon>AdBlue Temperatur</div>
                  <div class="val" style="color:${col}">${isNaN(v) ? '–' : Math.round(v)}<span> °C</span></div></div>`;
        ]]]
      defconc: |
        [[[
          const s = states[variables.e_def_conc];
          const v = s ? parseFloat(s.state) : NaN;
          const col = isNaN(v) ? 'inherit' : (v < 31.8 || v > 33.2) ? '#fb8c00' : 'inherit';
          return `<div class="tile"><div class="lbl"><ha-icon icon="mdi:flask-outline"></ha-icon>AdBlue Konzentration</div>
                  <div class="val" style="color:${col}">${isNaN(v) ? '–' : v.toFixed(1).replace('.', ',')}<span> %</span></div></div>`;
        ]]]
      rpm: |
        [[[
          const s = states[variables.e_rpm];
          const v = s ? parseFloat(s.state) : NaN;
          return `<div class="tile"><div class="lbl"><ha-icon icon="mdi:gauge"></ha-icon>Drehzahl</div>
                  <div class="val">${isNaN(v) ? '–' : Math.round(v)}<span> rpm</span></div></div>`;
        ]]]
      speed: |
        [[[
          const s = states[variables.e_speed];
          const v = s ? parseFloat(s.state) : NaN;
          return `<div class="tile"><div class="lbl"><ha-icon icon="mdi:speedometer"></ha-icon>Geschwindigkeit</div>
                  <div class="val">${isNaN(v) ? '–' : Math.round(v)}<span> km/h</span></div></div>`;
        ]]]
      l100: |
        [[[
          const s = states[variables.e_l100];
          const v = s ? parseFloat(s.state) : NaN;
          return `<div class="tile"><div class="lbl"><ha-icon icon="mdi:fuel"></ha-icon>Verbrauch</div>
                  <div class="val">${isNaN(v) ? '–' : v.toFixed(1).replace('.', ',')}<span> l/100 km</span></div></div>`;
        ]]]
      lph: |
        [[[
          const s = states[variables.e_lph];
          const v = s ? parseFloat(s.state) : NaN;
          return `<div class="tile"><div class="lbl"><ha-icon icon="mdi:fuel"></ha-icon>Verbrauch momentan</div>
                  <div class="val">${isNaN(v) ? '–' : v.toFixed(1).replace('.', ',')}<span> l/h</span></div></div>`;
        ]]]
      temp: |
        [[[
          const s = states[variables.e_temp];
          const v = s ? parseFloat(s.state) : NaN;
          const col = isNaN(v) ? 'inherit' : v < 60 ? '#42a5f5' : v > 105 ? '#e53935' : 'inherit';
          return `<div class="tile"><div class="lbl"><ha-icon icon="mdi:coolant-temperature"></ha-icon>Kühlmittel</div>
                  <div class="val" style="color:${col}">${isNaN(v) ? '–' : Math.round(v)}<span> °C</span></div></div>`;
        ]]]
      oil: |
        [[[
          const s = states[variables.e_oil];
          const v = s ? parseFloat(s.state) : NaN;
          const col = isNaN(v) ? 'inherit' : v < 60 ? '#42a5f5' : v > 125 ? '#e53935' : 'inherit';
          return `<div class="tile"><div class="lbl"><ha-icon icon="mdi:oil-temperature"></ha-icon>Öltemperatur</div>
                  <div class="val" style="color:${col}">${isNaN(v) ? '–' : Math.round(v)}<span> °C</span></div></div>`;
        ]]]
      ambient: |
        [[[
          const s = states[variables.e_ambient];
          const v = s ? parseFloat(s.state) : NaN;
          const col = isNaN(v) ? 'inherit' : v <= 3 ? '#42a5f5' : 'inherit';
          const ice = (!isNaN(v) && v <= 3) ? ' · Glättegefahr' : '';
          return `<div class="tile"><div class="lbl"><ha-icon icon="mdi:thermometer"></ha-icon>Außen${ice}</div>
                  <div class="val" style="color:${col}">${isNaN(v) ? '–' : Math.round(v)}<span> °C</span></div></div>`;
        ]]]
      baro: |
        [[[
          const s = states[variables.e_baro];
          const v = s ? parseFloat(s.state) : NaN;
          return `<div class="tile"><div class="lbl"><ha-icon icon="mdi:gauge"></ha-icon>Luftdruck</div>
                  <div class="val">${isNaN(v) ? '–' : Math.round(v)}<span> hPa</span></div></div>`;
        ]]]
      dpf: |
        [[[
          const r = states[variables.e_dpf_regen];
          const ls = states[variables.e_dpf_load];
          const ds = states[variables.e_dpf_dp];
          const load = ls ? parseFloat(ls.state) : NaN;
          const dp = ds ? parseFloat(ds.state) : NaN;
          const active = r && r.state === 'on';
          const known = r && (r.state === 'on' || r.state === 'off');
          const bg = active ? 'rgba(251,140,0,0.25)' : 'var(--secondary-background-color)';
          const status = active ? 'Regeneration läuft – Motor nicht abstellen'
                                : known ? 'keine Regeneration' : '–';
          const pct = isNaN(load) ? 0 : Math.max(0, Math.min(100, load));
          const col = pct >= 80 ? '#fb8c00' : '#8d6e63';
          const extra = isNaN(dp) ? '' : `<span style="margin-left:8px">Δp ${Math.round(dp)} mbar</span>`;
          return `<div class="tile" style="background:${bg}">
                    <div class="lbl"><ha-icon icon="mdi:${active ? 'fire' : 'air-filter'}"></ha-icon>Rußpartikelfilter</div>
                    <div class="val" style="font-size:16px${active ? ';color:#fb8c00' : ''}">${status}</div>
                    <div class="sub" style="font-size:12px;opacity:0.8;margin-top:4px">Beladung ${isNaN(load) ? '–' : Math.round(load) + ' %'}${extra}</div>
                    <div class="bar"><div class="fill" style="width:${pct}%;background:${col}"></div></div>
                  </div>`;
        ]]]
      volt: |
        [[[
          const s = states[variables.e_volt];
          const v = s ? parseFloat(s.state) : NaN;
          const col = isNaN(v) ? 'inherit' : v >= 13.2 ? '#4caf50' : v < 12.0 ? '#e53935' : 'inherit';
          const hint = isNaN(v) ? '' : v >= 13.2 ? ' · lädt' : '';
          return `<div class="tile"><div class="lbl"><ha-icon icon="mdi:car-battery"></ha-icon>Bordspannung${hint}</div>
                  <div class="val" style="color:${col}">${isNaN(v) ? '–' : v.toFixed(1).replace('.', ',')}<span> V</span></div></div>`;
        ]]]
      last: |
        [[[
          const s = states[variables.e_last];
          const t = (s && s.state && s.state !== 'unknown' && s.state !== 'unavailable') ? s.state : '–';
          return `<div class="tile"><div class="lbl"><ha-icon icon="mdi:console"></ha-icon>OBD letzte Antwort</div>
                  <div class="mono">${t}</div></div>`;
        ]]]

  # ---------------------------------------------------------------
  # Bedienung
  # ---------------------------------------------------------------
  - type: horizontal-stack
    cards:
      - type: tile
        entity: switch.pepper_ducato_obd_ble_vgate_verbindung
        name: Vgate Verbindung
        icon: mdi:bluetooth
        tap_action:
          action: toggle
      - type: tile
        entity: button.pepper_ducato_obd_ble_pid_scan
        name: PID-Scan
        icon: mdi:magnify-scan
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.pepper_ducato_obd_ble_pid_scan
