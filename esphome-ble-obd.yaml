# ---------------------------------------------------------------
# Abfragezyklen
# ---------------------------------------------------------------
interval:
  # Normalbetrieb: alle 3 s Drehzahl, Tempo, Kühlmittel, Verbrauch, Spannung.
  # Jeder 10. Zyklus (~30 s) zusätzlich AdBlue, AdBlue-Sensordaten, Dieseltank,
  # Außentemperatur, Öltemperatur, Luftdruck, Rußpartikelfilter, km-Zähler.
  - interval: 3s
    then:
      - if:
          condition:
            lambda: 'return id(elm_ready) && id(ecu_awake) && !id(send_cmd)->is_running();'
          then:
            - script.execute: { id: send_cmd, cmd: "010C" }
            - script.execute: { id: send_cmd, cmd: "010D" }
            - script.execute: { id: send_cmd, cmd: "0105" }
            - script.execute: { id: send_cmd, cmd: "019D" }
            - script.execute: { id: send_cmd, cmd: "ATRV" }
            - if:
                condition:
                  lambda: 'return (id(cycle_n)++ % 10) == 0;'
                then:
                  - if:
                      condition:
                        lambda: 'return id(pid85_supported);'
                      then:
                        # AdBlue physisch adressiert (siehe substitutions)
                        - script.execute: { id: send_cmd, cmd: "ATSH${adblue_hdr}" }
                        - script.execute: { id: send_cmd, cmd: "0185" }
                        - script.execute: { id: send_cmd, cmd: "ATSH${default_hdr}" }
                  - script.execute: { id: send_cmd, cmd: "019B" }
                  - script.execute: { id: send_cmd, cmd: "012F" }
                  - script.execute: { id: send_cmd, cmd: "0146" }
                  - script.execute: { id: send_cmd, cmd: "015C" }
                  - script.execute: { id: send_cmd, cmd: "0133" }
                  - script.execute: { id: send_cmd, cmd: "018B" }
                  - script.execute: { id: send_cmd, cmd: "017A" }
                  # km-Zähler: funktional, nur Antwort von Motorsteuergerät 10 annehmen
                  - script.execute: { id: send_cmd, cmd: "ATCRA${engine_rx}" }
                  - script.execute: { id: send_cmd, cmd: "0131" }
                  - script.execute: { id: send_cmd, cmd: "ATAR" }

  # Sparmodus: Spannung alle 15 s (belastet den CAN-Bus nicht)
  - interval: 15s
    then:
      - if:
          condition:
            lambda: 'return id(elm_ready) && !id(ecu_awake) && !id(send_cmd)->is_running();'
          then:
            - script.execute: { id: send_cmd, cmd: "ATRV" }

  # Sparmodus: 1x pro Minute Weckprobe
  - interval: 60s
    then:
      - if:
          condition:
            lambda: 'return id(elm_ready) && !id(ecu_awake) && !id(send_cmd)->is_running();'
          then:
            - script.execute: { id: send_cmd, cmd: "0100" }

# ---------------------------------------------------------------
# Bedienung aus Home Assistant
# ---------------------------------------------------------------
switch:
  - platform: ble_client
    ble_client_id: vgate
    name: "Vgate Verbindung"
    restore_mode: ALWAYS_ON

number:
  - platform: template
    name: "Kilometerstand setzen"
    icon: mdi:counter
    entity_category: config
    mode: box
    min_value: 0
    max_value: 999999
    step: 1
    unit_of_measurement: "km"
    update_interval: 60s
    lambda: 'return id(odo_km);'
    set_action:
      - lambda: |-
          id(odo_km) = x;
          id(obd_odo).publish_state(x);
          ESP_LOGI("obd", "Kilometerstand auf %.0f km gesetzt", x);

text:
  - platform: template
    name: "OBD-Adapter MAC (manuell)"
    icon: mdi:bluetooth
    entity_category: config
    mode: text
    max_length: 17
    update_interval: 10s
    lambda: |-
      // aktuell genutzte MAC anzeigen (gespeichert, sonst fallback_mac)
      uint64_t m = id(adapter_mac);
      if (m == 0) {
        if (id(search_active)) return std::string("");
        return std::string("${fallback_mac}");
      }
      char buf[18];
      snprintf(buf, sizeof(buf), "%02X:%02X:%02X:%02X:%02X:%02X",
               (int)((m >> 40) & 0xFF), (int)((m >> 32) & 0xFF), (int)((m >> 24) & 0xFF),
               (int)((m >> 16) & 0xFF), (int)((m >> 8) & 0xFF), (int)(m & 0xFF));
      return std::string(buf);
    set_action:
      - lambda: |-
          unsigned int b[6];
          if (sscanf(x.c_str(), "%x:%x:%x:%x:%x:%x", &b[0], &b[1], &b[2], &b[3], &b[4], &b[5]) != 6) {
            ESP_LOGW("adapter", "'%s' ist keine gültige MAC (Format AA:BB:CC:DD:EE:FF)", x.c_str());
            return;
          }
          uint64_t mac = 0;
          for (int i = 0; i < 6; i++) mac = (mac << 8) | (b[i] & 0xFF);
          id(adapter_mac) = mac;
          id(adapter_profile) = 0;
          id(vgate)->disconnect();
          id(vgate)->set_address(mac);
          id(adapter_info).publish_state("manuell " + x);
          ESP_LOGI("adapter", "OBD-Adapter manuell gesetzt: %s", x.c_str());
  - platform: template
    name: "OBD Befehl"
    id: custom_cmd
    optimistic: true
    mode: text
    max_length: 24
    initial_value: "0185"

button:
  - platform: template
    name: "OBD Befehl senden"
    icon: mdi:send
    on_press:
      - script.execute:
          id: send_cmd
          cmd: !lambda 'return id(custom_cmd).state;'
  - platform: template
    name: "PID-Scan"
    icon: mdi:magnify-scan
    on_press:
      - lambda: 'id(diag_mode) = true;'
      - script.execute: { id: send_cmd, cmd: "ATH1" }
      - script.execute: { id: send_cmd, cmd: "0100" }
      - script.execute: { id: send_cmd, cmd: "0120" }
      - script.execute: { id: send_cmd, cmd: "0140" }
      - script.execute: { id: send_cmd, cmd: "0160" }
      - script.execute: { id: send_cmd, cmd: "0180" }
      - script.execute: { id: send_cmd, cmd: "01A0" }
      - script.execute: { id: send_cmd, cmd: "01C0" }
      - script.execute: { id: send_cmd, cmd: "ATH0" }
      - script.wait: send_cmd
      - lambda: 'id(diag_mode) = false;'
      - logger.log: "PID-Scan beendet"
  - platform: template
    name: "Test 0185 (AdBlue Standard-PID)"
    on_press:
      - script.execute: { id: send_cmd, cmd: "ATSH${adblue_hdr}" }
      - script.execute: { id: send_cmd, cmd: "0185" }
      - script.execute: { id: send_cmd, cmd: "ATSH${default_hdr}" }
  - platform: template
    name: "Diagnose: Steuergeräte-IDs"
    icon: mdi:car-cog
    on_press:
      - lambda: 'id(diag_mode) = true;'
      - script.execute: { id: send_cmd, cmd: "ATH1" }
      - script.execute: { id: send_cmd, cmd: "0100" }
      - script.execute: { id: send_cmd, cmd: "0185" }
      - script.execute: { id: send_cmd, cmd: "ATH0" }
      - script.wait: send_cmd
      - lambda: 'id(diag_mode) = false;'
      - logger.log: "Diagnose beendet"
  - platform: template
    name: "Tageskilometer zurücksetzen"
    icon: mdi:restart
    on_press:
      - lambda: |-
          id(trip_km) = 0;
          id(obd_trip).publish_state(0);
  - platform: template
    name: "OBD-Adapter neu suchen"
    icon: mdi:bluetooth-audio
    entity_category: config
    on_press:
      - lambda: |-
          id(adapter_mac) = 0;
          id(adapter_profile) = 0;
          id(search_active) = true;
          id(vgate)->disconnect();
          id(vgate)->set_address(0);
          id(adapter_info).publish_state("Suche läuft …");
          ESP_LOGI("adapter", "Gespeicherter Adapter gelöscht – suche neu");
  - platform: template
    name: "Vgate ATZ senden"
    on_press:
      - script.execute: { id: send_cmd, cmd: "ATZ" }
